plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.disfarce.jogo'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.disfarce.jogo'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
