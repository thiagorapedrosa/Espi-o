<style>
/* VOICE: jogo de festa para a família, vibrante como um jogo de celular de verdade
   IDEA: cartas de brinquedo brilhantes sobre um céu com raios de sol girando
   PICTURE: figuras em 3D (Fluent Emoji) grandes em cada palavra, avatar e categoria
   COLOUR and TYPE: azul elétrico e ciano no fundo, botões doces em amarelo, verde e coral; Baloo 2
   LAYOUT: uma coluna de celular, botões gordos em 3D no rodapé */
:root{color-scheme:light;--ink:#1b2a5c;--mute:#51629a;--deep:#1a4fc4}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--ink);font:500 17px/1.4 "Baloo 2",system-ui,sans-serif;overflow-x:clip;
  background:radial-gradient(circle at 15% 0%,#7ff0ff 0,#0000 38%),radial-gradient(circle at 100% 35%,#8f9dff 0,#0000 42%),linear-gradient(165deg,#2f6bff,#20bfff) fixed}
body::before{content:"";position:fixed;left:50%;top:30%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(#ffffff14 0 9deg,#0000 9deg 22deg);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
h1,h2,.big{font-weight:800;line-height:1;margin:0;text-wrap:balance}
.t3d{color:#fff;text-shadow:0 1px 0 #d6ecff,0 2px 0 #b3d8ff,0 3px 0 #8cc0ff,0 4px 0 #5f9dff,0 5px 0 #3b7bf0,0 6px 0 var(--deep),0 12px 16px #0a2a7a80}
h1{font-size:clamp(46px,8vh,72px);text-align:center;letter-spacing:1px}
p{margin:6px 0}.mute{color:var(--mute)}.small{font-size:15px}.center{text-align:center}
.grow{flex:1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:52px}
.top h2{flex:1;font-size:27px;color:#fff;text-shadow:0 3px 0 var(--deep),0 6px 12px #0a2a7a66}
button{--t:#ffe96e;--b:#ffbe0b;--e:#d18c00;--tx:#5a3200;font:800 21px/1 "Baloo 2",sans-serif;min-height:62px;border:0;border-radius:22px;width:100%;padding:4px 18px 0;color:var(--tx);cursor:pointer;
  background:linear-gradient(var(--t),var(--b));box-shadow:inset 0 3px 0 #ffffffa0,inset 0 -4px 0 #0000001a,0 6px 0 var(--e),0 12px 20px #0b2a7a40;text-shadow:0 1px 0 #ffffff70;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(5px);box-shadow:inset 0 3px 0 #ffffffa0,0 1px 0 var(--e),0 4px 8px #0b2a7a40}
button:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,#cover:focus-visible{outline:4px solid #fff;outline-offset:3px}
.go{--t:#72f7a0;--b:#1fc25a;--e:#0f8a3a;--tx:#fff;text-shadow:0 2px 0 #0b6b2c}
.hot{--t:#ff9f80;--b:#ff4d4d;--e:#c02727;--tx:#fff;text-shadow:0 2px 0 #9b1f1f}
.white{--t:#fff;--b:#e4eeff;--e:#a6bfec;--tx:var(--ink);text-shadow:none}
.icon{width:52px;min-height:52px;padding:0;border-radius:18px;flex:none;font-size:28px}
.row{display:flex;gap:10px}.row>*{flex:1}
.row>button{white-space:nowrap;padding-inline:8px;font-size:clamp(17px,5vw,21px)}
.stack>*+*{margin-top:14px}
.intro{margin:12px 0 14px;padding:12px 14px}.intro p{margin:0;font-size:16px}
.board{padding:10px 14px 12px}.board .label{font-size:18px;margin-bottom:6px}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.mini div{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.mini span:not(.av){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini b{font-size:20px}.mini .av{width:34px;height:34px;border-width:2px}
.impbox{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-bottom:14px}
.impbox .stepper{gap:8px}.impbox .stepper b{font-size:30px}.impbox .stepper button{width:46px;min-height:46px;font-size:26px}
.av.m{width:100px;height:100px;border-width:5px}
.whoBox.tight{margin:-8px 0 10px}.whoBox.tight .name3d{font-size:clamp(34px,10vw,44px);margin-top:4px}
.endcard{position:relative!important;inset:auto!important;flex:none;justify-content:center!important;padding:18px 14px!important;margin-bottom:18px}
.endcard .pic{--s:clamp(110px,20vh,170px)}
.panel{background:linear-gradient(#fff,#eef5ff);border-radius:28px;box-shadow:0 7px 0 #1a4fc480,0 16px 30px #0a2a7a50;padding:16px;margin-bottom:18px}
.label{font-weight:800;font-size:21px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.label button{width:auto;min-height:44px;font-size:16px;padding:2px 14px 0;border-radius:14px;box-shadow:inset 0 2px 0 #fff,0 4px 0 var(--e)}
.count{background:linear-gradient(#72f7a0,#1fc25a);color:#fff;border-radius:999px;padding:2px 12px 0;font-size:16px;text-shadow:0 1px 0 #0b6b2c;box-shadow:0 3px 0 #0f8a3a}
input[type=text],textarea{width:100%;font:600 18px "Baloo 2",sans-serif;color:var(--ink);background:#fff;border:3px solid #cddfff;border-radius:16px;padding:8px 12px;box-shadow:inset 0 3px 0 #e8f0ff}
textarea{min-height:100px;resize:vertical}
.e3d{width:var(--s,40px);height:var(--s,40px);object-fit:contain;display:inline-block;vertical-align:middle;-webkit-user-drag:none;user-select:none}
.etx{font-size:calc(var(--s,40px) * .8);line-height:1;display:inline-grid;place-items:center;width:var(--s,40px);height:var(--s,40px)}
.player{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.player input{flex:1;min-height:50px}
.av{--s:78%;display:grid;place-items:center;border-radius:50%;width:60px;height:60px;flex:none;border:4px solid #fff;
  background:radial-gradient(circle at 35% 30%,#fff 0,var(--c1) 30%,var(--c2) 100%);box-shadow:0 5px 0 #1a4fc455,0 8px 14px #0a2a7a40}
.av>*{width:78%;height:78%}
button.av{min-height:52px;width:52px;height:52px;padding:0;border-width:3px}
.player .icon{width:48px;min-height:48px}
.av.xl{width:138px;height:138px;border-width:6px}
.av.l{width:76px;height:76px}
.av.s{width:44px;height:44px;border-width:3px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{--t:#fff;--b:#e9f1ff;--e:#b6cbef;--tx:var(--ink);--s:52px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px 4px;font-size:15px;position:relative;text-shadow:none;border-radius:20px}
.tile.on{--t:#fff4a6;--b:#ffd23f;--e:#d99a00}
.tile.on::after{content:"✓";position:absolute;top:-8px;right:-6px;width:28px;height:28px;border-radius:50%;background:linear-gradient(#72f7a0,#1fc25a);color:#fff;border:3px solid #fff;display:grid;place-items:center;font-size:15px;box-shadow:0 3px 6px #0004}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font-size:36px;min-width:30px;text-align:center}
.stepper button{width:52px;min-height:52px;padding:0;font-size:30px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{width:auto;min-height:48px;font-size:17px;padding:2px 16px 0;border-radius:999px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0}
.switch+.switch{border-top:2px dashed #d3e1fb;margin-top:10px;padding-top:12px}
.switch input{appearance:none;width:64px;height:36px;border-radius:36px;background:#c9d6ef;position:relative;flex:none;cursor:pointer;box-shadow:inset 0 3px 4px #0002}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:linear-gradient(#fff,#e3ebfa);box-shadow:0 3px 4px #0003;transition:.2s}
.switch input:checked{background:linear-gradient(#5be38a,#1fc25a)}.switch input:checked::after{left:31px}
/* capa */
.hero{position:relative;height:clamp(150px,24vh,250px);display:grid;place-items:center}
.hero .main{--s:clamp(110px,18vh,190px);filter:drop-shadow(0 16px 18px #0a2a7a70);animation:bob 3s ease-in-out infinite}
.hero .orb{position:absolute;--s:clamp(38px,6vh,58px);filter:drop-shadow(0 8px 8px #0a2a7a50);animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
/* cartão de quem joga */
.whoBox{position:relative;display:flex;flex-direction:column;align-items:center;margin:-4px 0 12px}
.burst{position:absolute;top:-30px;left:50%;width:300px;height:220px;margin-left:-150px;pointer-events:none;border-radius:50%;
  background:repeating-conic-gradient(#fff5 0 10deg,#fff0 10deg 22deg);-webkit-mask:radial-gradient(closest-side,#000 30%,#0000);mask:radial-gradient(closest-side,#000 30%,#0000);animation:spin 18s linear infinite}
.whoBox .av{position:relative}
.name3d{position:relative;font-size:clamp(40px,12vw,54px);font-weight:800;line-height:1;margin-top:8px;overflow-wrap:anywhere;text-align:center}
.card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:30px;padding:24px 18px;margin:4px 0 20px;min-height:300px;position:relative;overflow:hidden;
  background:linear-gradient(#fff,#eef5ff);box-shadow:0 8px 0 #1a4fc480,0 18px 30px #0a2a7a50}
.talk{position:relative;overflow:hidden;flex:1;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;border-radius:30px;padding:22px 16px;margin:4px 0 20px;color:#fff;
  background:radial-gradient(circle at 50% 35%,#b9ffe9 0,#0000 45%),linear-gradient(165deg,#36e6a8,#0ea47a);box-shadow:0 8px 0 #0b7a5b,0 18px 30px #0a2a7a50}
.talk>*{position:relative}
.rays{position:absolute!important;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(#ffffff40 0 10deg,#fff0 10deg 22deg);animation:spin 18s linear infinite;pointer-events:none}
.bub{--s:clamp(70px,12vh,120px);filter:drop-shadow(0 12px 12px #0004);animation:bob 2.6s ease-in-out infinite}
.say{font-size:clamp(17px,2.6vh,21px);font-weight:800;line-height:1.2;text-shadow:0 2px 0 #0b7a5b;max-width:320px}
.order{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;background:#ffffff40;border-radius:999px;padding:6px 10px;margin-top:8px}
.arr{font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #0b7a5b}
.talk .timer{color:#fff}
.cd{position:fixed;inset:0;z-index:8;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#ffd36b 0,#0000 40%),linear-gradient(165deg,#ff5c8d,#7b2ff7);animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.cdBox{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;text-align:center;color:#fff}
.ask{font-size:clamp(24px,7vw,30px);font-weight:800;line-height:1.15;text-shadow:0 3px 0 #0005;max-width:330px;margin:4px 0 10px}
.clock{position:relative;display:flex;flex-direction:column;align-items:center}
.alarm{--s:96px;filter:drop-shadow(0 10px 10px #0005);animation:shake .25s ease-in-out infinite;margin-bottom:-18px;position:relative;z-index:1}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.ring{--p:0;width:200px;height:200px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#fff 0 58%,#0000 59%),conic-gradient(#ffd23f calc(var(--p) * 360deg),#ffffff55 0);box-shadow:0 10px 0 #0003,0 20px 40px #0004}
.num{font-size:110px;font-weight:800;line-height:1;color:var(--ink);padding-top:10px}
.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{from{transform:scale(.3);opacity:0}}
.timer{font-size:clamp(54px,10vh,84px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin-top:10px;color:var(--ink)}
.timer.end{color:#ff4d4d}
/* carta de espiar */
.peek{position:relative;flex:1;min-height:340px;margin:0 0 20px;perspective:2200px}
.under,#cover{position:absolute;inset:0;border-radius:30px;overflow:hidden}
.under{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:16px 14px 26px;box-shadow:0 8px 0 #d98a00,0 18px 30px #0a2a7a50}
.under::before{content:"";position:absolute;left:50%;top:38%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(#ffffff55 0 10deg,#fff0 10deg 22deg);animation:spin 16s linear infinite}
.under>*{position:relative}
.under.word{background:radial-gradient(circle at 50% 38%,#fffbe0 0,#0000 45%),linear-gradient(165deg,#fff36b,#ffa31a);color:#4a2300}
.under.imp{background:radial-gradient(circle at 50% 38%,#ffd1e6 0,#0000 45%),linear-gradient(165deg,#ff5c8d,#c8166b);color:#fff;box-shadow:0 8px 0 #8e0f4b,0 18px 30px #0a2a7a50}
.under .pic{--s:clamp(140px,44vw,190px);filter:drop-shadow(0 14px 14px #00000045);animation:bob 2.6s ease-in-out infinite}
.under .big{font-size:clamp(38px,12vw,54px);overflow-wrap:anywhere;text-shadow:0 3px 0 #ffffff80}
.under.imp .big{text-shadow:0 3px 0 #8e0f4b}
.spark{position:absolute;--s:34px;animation:tw 1.8s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.6) rotate(20deg);opacity:.5}}
.tag{display:inline-flex;align-items:center;gap:6px;background:#ffffffc0;border-radius:999px;padding:3px 14px 1px 6px;font-weight:800;font-size:16px;color:var(--ink);box-shadow:0 3px 0 #0000001f;--s:26px}
.clue{display:flex;align-items:center;gap:8px;text-align:left;background:#ffffffe8;color:var(--ink);border-radius:18px;padding:8px 14px 6px 8px;margin-top:8px;font-size:18px;font-weight:600;line-height:1.2;box-shadow:0 4px 0 #8e0f4b55;--s:38px;max-width:100%}
.clue img,.clue .etx{flex:none}
.under.imp .pic{--s:clamp(110px,32vw,150px)}
#cover{transform-origin:50% 0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-weight:800;font-size:24px;text-align:center;text-shadow:0 2px 0 #a6301a;
  background:radial-gradient(#ffffff38 2px,#0000 3px) 0 0/22px 22px,radial-gradient(circle at 50% 40%,#ffb36b 0,#0000 55%),linear-gradient(160deg,#ff6a4d,#ff2e63);box-shadow:0 8px 0 #b8243f,0 18px 30px #0a2a7a50;will-change:transform}
#cover::before{content:"";position:absolute;inset:14px;border:4px solid #ffffffd0;border-radius:20px;pointer-events:none}
#cover::after{content:"";position:absolute;inset:0;background:linear-gradient(#fff0,#fff);opacity:calc(var(--shade,0) * .5);pointer-events:none}
#cover .q{--s:110px;filter:drop-shadow(0 10px 10px #0005)}
.hand{--s:46px;display:inline-block;animation:up 1.2s ease-in-out infinite}
@keyframes up{50%{transform:translateY(-12px)}}
.vote{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.vote button{--t:#fff;--b:#e9f1ff;--e:#b6cbef;--tx:var(--ink);text-shadow:none;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:19px;overflow-wrap:anywhere}
.vote button:disabled{opacity:.35}
.score{width:100%;border-collapse:collapse}
.score td{padding:6px 4px;border-bottom:2px dashed #d3e1fb;font-weight:700}
.score td:first-child{width:56px}
.score td:last-child{text-align:right;font-size:28px;font-weight:800}
.mix{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;width:100%;margin-top:8px}
.mix div{background:#ffffffc0;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px;line-height:1.15;color:var(--ink);--s:38px}
.mix .av.s{width:34px;height:34px}
.endcard .pic.sm{--s:clamp(80px,13vh,130px)}
.err{color:#fff;background:#ff4d4dd0;border-radius:12px;font-weight:800;padding:0 10px}.err:empty{display:none}
.err{margin-bottom:10px;padding-top:4px}
.modal{position:fixed;inset:0;background:#0b1b4dc0;display:grid;place-items:center;padding:16px;z-index:5;backdrop-filter:blur(3px)}
.modal .panel{max-width:470px;width:100%;margin:0;max-height:90vh;overflow:auto}
.avgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:6px}
.avgrid button{min-height:0;aspect-ratio:1;padding:0;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c1) 30%,var(--c2) 100%);box-shadow:0 4px 0 #1a4fc455;display:grid;place-items:center;--s:80%}
.avgrid button>*{width:80%;height:80%}
.avgrid button.sel{outline:4px solid #1fc25a;outline-offset:2px}
.avgrid button:disabled{opacity:.25}
.sub{font-weight:800;margin:10px 0 6px}
.hidden{display:none!important}
.pop{animation:pop .45s ease-out}
@keyframes pop{40%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.rays,.bub,.alarm,.bump,body::before,.burst,.under::before,.hero .main,.hero .orb,.under .pic,.spark,.hand,.pop{animation:none}}
</style>

// Sorteio justo: gerador criptográfico + quem foi impostor nas últimas rodadas tem menos chance de repetir.
function drawImpostors(names, k) {
  const pool = names.map(n => {
    let w = 1;
    if ((recent[recent.length - 1] || []).includes(n)) w *= 0.25;
    if ((recent[recent.length - 2] || []).includes(n)) w *= 0.6;
    return { n, w };
  });
  const out = [];
  while (out.length < k && pool.length) {
    let r = rnd() * pool.reduce((s, p) => s + p.w, 0), i = 0;
    while (i < pool.length - 1 && (r -= pool[i].w) >= 0) i++;
    out.push(pool.splice(i, 1)[0].n);
  }
  return out;
}

function readPlayers() {
  document.querySelectorAll("[data-p]").forEach(i => cfg.players[+i.dataset.p].n = i.value);
  const h = $("#hint"); if (h) cfg.hint = h.checked;
  const c = $("#crazy"); if (c) cfg.crazy = c.checked;
  const d = $("#clue"); if (d) cfg.clue = d.checked;
}

function checkPlayers() {
  readPlayers();
  const players = cfg.players.map(p => ({ n: p.n.trim(), a: p.a })).filter(p => p.n);
  if (new Set(players.map(p => p.n.toLowerCase())).size !== players.length) return "Tem dois jogadores com o mesmo nome.";
  if (players.length < 3) return "Precisa de pelo menos 3 jogadores.";
  if (cfg.imps >= players.length - 1) return "Impostores demais para esse grupo.";
  cfg.players = players; persist(); return "";
}

function start() {
  const err = m => { const e = $("#err"); if (e) e.textContent = m; };
  const bad = checkPlayers();
  if (bad) { setup(); return $("#err").textContent = bad; }
  const players = cfg.players;
  const cats = allCats(), chosen = cfg.cats.filter(c => cats[c]);
  if (!chosen.length) return err("Escolha pelo menos uma categoria.");
  persist();
  // Rodada maluca: cerca de 1 em cada 7 rodadas, numa categoria com palavras para todos.
  const big = chosen.filter(c => cats[c].words.length >= players.length);
  if (cfg.crazy && big.length && rnd() < 1 / 7) {
    const cat = pick(big), ws = shuffle(cats[cat].words).slice(0, players.length);
    const own = {};
    players.forEach((p, i) => { const [pic, word] = split(ws[i]); own[p.n] = { pic: pic || cats[cat].icon, word }; });
    G = { players, imps: players.map(p => p.n), crazy: true, own, cat, catIcon: cats[cat].icon, i: 0, out: [], caught: [] };
    return reveal();
  }
  const pool = chosen.flatMap(c => cats[c].words.map(w => [c, w]));
  let fresh = pool.filter(([c, w]) => !used.includes(c + "|" + w));
  if (!fresh.length) { used = used.filter(u => !chosen.some(c => u.startsWith(c + "|"))); fresh = pool; }
  const [cat, raw] = pick(fresh);
  used.push(cat + "|" + raw);
  const [pic, word, hint] = split(raw);
  const imps = drawImpostors(players.map(p => p.n), cfg.imps);
  recent.push(imps); persist();
  G = { players, imps, cat, catIcon: cats[cat].icon, word, hint, pic: pic || cats[cat].icon, i: 0, out: [], caught: [] };
  reveal();
}

// Carta de cada jogador: avatar grande, nome, carta para espiar e botão de passar.
function reveal() {
  const p = G.players[G.i], last = G.i === G.players.length - 1;
  const imp = !G.crazy && G.imps.includes(p.n);
  const mine = G.crazy ? G.own[p.n] : { pic: G.pic, word: G.word };
  const sparks = [["8%","10%","0s"],["82%","8%",".5s"],["86%","46%","1s"],["6%","50%","1.3s"]].map(([l, t, d]) => `<span class="spark" style="left:${l};top:${t};animation-delay:${d}">${ico("✨")}</span>`).join("");
  show("reveal", `
    <div class="top"><button class="icon white" data-a="back" aria-label="Voltar">‹</button><h2>Carta ${G.i + 1} de ${G.players.length}</h2></div>
    <div class="whoBox"><div class="burst"></div>${avatar(p, "xl")}<div class="name3d t3d">${esc(p.n)}</div></div>
    <div class="peek">
      <div class="under ${imp ? "imp" : "word"}" aria-live="polite">${sparks}
        ${imp ? `${ico("🥸", "pic")}<div class="big">Você é o impostor!</div>
          ${cfg.hint ? `<p style="margin:6px 0 0"><span class="tag">${ico(G.catIcon)} ${esc(G.cat)}</span></p>` : ""}
          ${cfg.clue && G.hint ? `<div class="clue">${ico("💡")}<span><b>Dica:</b> ${esc(G.hint)}</span></div>` : ""}
          <p class="small" style="font-weight:700">Finja que sabe a figura!${G.imps.length > 1 ? ` Há ${G.imps.length} impostores.` : ""}</p>`
        : `<span class="tag">${ico(G.catIcon)} ${esc(G.cat)}</span>${ico(mine.pic, "pic")}<div class="big">${esc(mine.word)}</div>`}
      </div>
      <div id="cover" tabindex="0" role="button" aria-label="Carta virada. Arraste para cima ou segure para espiar.">
        ${ico("❓", "q")}<span class="hand">${ico("☝️")}</span>Arraste para cima<br>para espiar
      </div>
    </div>
    <button class="${last ? "go" : ""}" data-a="next" id="done" disabled>${last ? "Já vi! Começar" : "Já vi! Passar para o próximo"}</button>`);
  peek();
}

// Levantar a carta: arrastar para cima (ou segurar) dobra a capa pela borda de cima; soltar faz ela cair de volta.
function peek() {
  const cover = $("#cover"), done = $("#done");
  let ang = 0, y0 = null, hold = null, seen = false;
  const set = (a, anim) => {
    ang = a;
    cover.style.transition = anim ? "transform .45s cubic-bezier(.3,1.5,.5,1)" : "none";
    cover.style.transform = `rotateX(${a}deg)`;
    cover.style.setProperty("--shade", (a / 85).toFixed(2));
    if (a > 45 && !seen) { seen = true; done.disabled = false; done.classList.add("pop"); }
  };
  const release = () => { if (y0 === null) return; y0 = null; clearTimeout(hold); set(0, true); };
  cover.addEventListener("pointerdown", e => {
    y0 = e.clientY; try { cover.setPointerCapture(e.pointerId); } catch (_) {}
    hold = setTimeout(() => { if (y0 !== null && ang < 10) set(72, true); }, 380);
  });
  cover.addEventListener("pointermove", e => {
    if (y0 === null) return;
    const dy = y0 - e.clientY;
    if (dy > 6) { clearTimeout(hold); set(Math.max(0, Math.min(84, dy / cover.offsetHeight * 170)), false); }
  });
  cover.addEventListener("pointerup", release);
  cover.addEventListener("pointercancel", release);
  cover.addEventListener("lostpointercapture", release);
  cover.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); set(ang ? 0 : 72, true); } });
  cover.addEventListener("contextmenu", e => e.preventDefault());
}

function discuss() {
  const alive = G.players.filter(p => !G.out.includes(p.n));
  const first = pick(alive), right = rnd() < .5, dir = right ? "para a direita" : "para a esquerda";
  const k = alive.indexOf(first), order = alive.map((_, j) => alive[(k + (right ? j : alive.length - j)) % alive.length]);
  let left = cfg.time;
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  show("discuss", `
    <div class="top"><button class="icon white" data-a="back" aria-label="Voltar">‹</button><h2>Hora das dicas</h2></div>
    <div class="whoBox tight"><div class="burst"></div><p style="color:#fff;font-weight:800;position:relative;text-shadow:0 2px 0 var(--deep);margin:0">Quem começa</p>${avatar(first, "m")}<div class="name3d t3d">${esc(first.n)}</div>
      <p style="color:#fff;font-weight:700;position:relative;text-shadow:0 2px 0 var(--deep);margin:2px 0 0">e depois segue ${dir}</p></div>
    <div class="talk"><div class="rays"></div>
      ${cfg.time ? `<div class="timer t3d" id="tm">${fmt(left)}</div>` : `<span class="bub">${ico("💬")}</span>`}
      <p class="say">Cada um fala uma coisa sobre a figura, sem dizer o nome dela!</p>
      <div class="order">${order.map((p, j) => `${j ? `<span class="arr">›</span>` : ""}${avatar(p, "s")}`).join("")}</div></div>
    <div class="row">${cfg.time ? `<button class="white" data-a="pause" id="pz">Pausar</button>` : ""}<button class="hot" data-a="vote">Hora de votar!</button></div>`);
  if (cfg.time) {
    let paused = false;
    G.pause = () => { paused = !paused; $("#pz").textContent = paused ? "Continuar" : "Pausar"; };
    timerId = setInterval(() => {
      if (paused) return;
      left = Math.max(0, left - 1);
      const t = $("#tm"); if (!t) return;
      t.textContent = fmt(left);
      if (left === 0) { t.classList.add("end"); t.classList.remove("t3d"); t.textContent = "Votem!"; clearInterval(timerId); try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) {} }
    }, 1000);
  }
}

function vote() {
  const rest = G.crazy ? 1 : G.imps.length - G.caught.length;
  show("vote", `
    <div class="top"><button class="icon white" data-a="back" aria-label="Voltar">‹</button><h2>Quem é o impostor?</h2></div>
    <p class="center" style="color:#fff;font-weight:700;text-shadow:0 2px 0 var(--deep);margin:-4px 0 14px">Contem os votos e toquem em quem ganhou mais.${rest > 1 ? ` Ainda há ${rest} impostores.` : ""}</p>
    <div class="vote">${G.players.map(p => { const c = AVC[p.a % AVC.length]; return `<button style="--t:#fff;--b:${c[0]};--e:${c[1]}" data-a="pick" data-n="${esc(p.n)}" ${G.out.includes(p.n) ? "disabled" : ""}>${avatar(p, "l")}${esc(p.n)}</button>`; }).join("")}</div>
    <div class="grow"></div>
    <button class="white" data-a="back-discuss">Mais uma rodada de dicas</button>`);
}

// Relógio de 3 segundos antes de revelar quem foi votado.
function countdown(name) {
  const p = byName(name), el = document.createElement("div");
  el.className = "cd";
  el.innerHTML = `<div class="rays"></div><div class="cdBox">${avatar(p, "l")}<p class="ask">Será que <b>${esc(p.n)}</b> é o impostor?</p>
    <div class="clock">${ico("⏰", "alarm")}<div class="ring"><span class="num">3</span></div></div></div>`;
  document.body.appendChild(el);
  let ac = null; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  const beep = (f, d) => { if (!ac) return; try { const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.18, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d); o.start(); o.stop(ac.currentTime + d); } catch (e) {} };
  const ring = el.querySelector(".ring"), num = el.querySelector(".num"), t0 = performance.now();
  let last = 3; beep(660, .12);
  const tick = now => {
    if (!el.isConnected || !G) return;
    const t = (now - t0) / 1000, n = Math.ceil(3 - t);
    ring.style.setProperty("--p", Math.min(1, t / 3).toFixed(3));
    if (n !== last && n > 0) { last = n; num.textContent = n; num.classList.remove("bump"); void num.offsetWidth; num.classList.add("bump"); beep(660, .12); }
    if (t < 3) return requestAnimationFrame(tick);
    beep(990, .4); el.remove(); try { ac && ac.close(); } catch (e) {}
    choose(name);
  };
  requestAnimationFrame(tick);
}
const stopCountdown = () => document.querySelectorAll(".cd").forEach(x => x.remove());

function choose(name) {
  if (G.crazy) return finishCrazy();
  G.out.push(name);
  if (!G.imps.includes(name)) return finish("imps", `${name} não era o impostor!`);
  G.caught.push(name);
  modal(`<div class="center">${avatar(byName(name), "xl")}<h2 style="margin-top:10px">Pegou! ${esc(name)} era o impostor!</h2>
    <p>Última chance: ${esc(name)} tenta adivinhar a figura secreta.</p></div>
    <div class="row"><button class="white" data-a="guess-no">Errou</button><button class="hot" data-a="guess-yes">Acertou</button></div>`);
}

function afterGuess(ok) {
  closeModal();
  const name = G.caught[G.caught.length - 1];
  if (ok) { add(name, 1); return finish("steal", `${name} foi pego, mas adivinhou!`); }
  if (G.caught.length < G.imps.length) return vote();
  finish("crew", "Vocês descobriram o impostor!");
}

function add(n, v) { scores[n] = (scores[n] || 0) + v; }

function finish(who, msg) {
  const crew = G.players.filter(p => !G.imps.includes(p.n));
  if (who === "crew") crew.forEach(p => add(p.n, 1));
  if (who === "imps") G.imps.filter(n => !G.caught.includes(n)).forEach(n => add(n, 2));
  if (who === "steal") G.imps.filter(n => !G.caught.includes(n)).forEach(n => add(n, 1));
  persist();
  const win = who === "crew";
  show("end", `
    <div class="top"><h2>${win ? "A turma venceu!" : "O impostor venceu!"}</h2></div>
    <div class="under word pop endcard">
      <p style="font-weight:800;font-size:20px">${esc(msg)}</p>
      <p class="small" style="font-weight:700">A figura secreta era</p>${ico(G.pic, "pic")}<div class="big">${esc(G.word)}</div>
      <p style="margin-top:12px;font-weight:700">${G.imps.length > 1 ? "Impostores" : "Impostor"}:</p>
      <div class="row" style="justify-content:center;flex-wrap:wrap">${G.imps.map(n => `<div style="flex:none;display:flex;flex-direction:column;align-items:center">${avatar(byName(n), "l")}<b>${esc(n)}</b></div>`).join("")}</div></div>
    <div class="grow"></div>
    <div class="row"><button class="white" data-a="home">Menu</button><button class="go" data-a="again">Jogar de novo</button></div>`);
}

function finishCrazy() {
  show("end", `
    <div class="top"><h2>Rodada maluca!</h2></div>
    <div class="under imp pop endcard">
      ${ico("🤪", "pic sm")}<div class="big" style="font-size:clamp(30px,9vw,44px)">Todo mundo era impostor!</div>
      <p style="font-weight:700">Cada um tinha uma figura diferente:</p>
      <div class="mix">${G.players.map(p => `<div>${avatar(p, "s")}${ico(G.own[p.n].pic)}${esc(G.own[p.n].word)}<span class="mute small">${esc(p.n)}</span></div>`).join("")}</div></div>
    <div class="grow"></div>
    <div class="row"><button class="white" data-a="home">Menu</button><button class="go" data-a="again">Jogar de novo</button></div>`);
}

function scoreTable() {
  return `<div class="panel"><table class="score">${G.players.slice().sort((a, b) => (scores[b.n] || 0) - (scores[a.n] || 0)).map(p => `<tr><td>${avatar(p, "s")}</td><td>${esc(p.n)}</td><td>${scores[p.n] || 0}</td></tr>`).join("")}</table>
    <p class="mute small" style="margin-top:8px">Turma descobre: +1 para cada um. Impostor escapa: +2. Impostor pego que adivinha: +1. Rodada maluca não vale ponto.</p></div>`;
}

function rules() {
  modal(`<h2>Como jogar</h2>
    <p><b>1.</b> O celular escolhe uma figura secreta e sorteia um impostor.</p>
    <p><b>2.</b> Cada um pega o celular sozinho e levanta a carta para espiar. O impostor não vê a figura!</p>
    <p><b>3.</b> Cada um fala uma coisa sobre a figura, sem dizer o nome. Exemplo: para ${ico("🐘", "")} dá para dizer “é grande” ou “tem tromba”.</p>
    <p><b>4.</b> Todo mundo vota em quem parece estar inventando. Se acertarem, o impostor ainda pode tentar adivinhar a figura.</p>
    <p><b>Dica:</b> se a opção estiver ligada, o impostor recebe uma pista fácil, como “Corre muito rápido” para o Flash.</p>
    <p><b>Rodada maluca:</b> às vezes todo mundo é impostor e cada um recebe uma figura diferente. Ninguém sabe até o fim!</p>
    <button class="go" data-a="close">Entendi!</button>`);
}

function newCat() {
  modal(`<h2>Nova categoria</h2>
    <div class="row"><input type="text" id="ci" maxlength="4" placeholder="⭐" style="flex:0 0 74px;text-align:center;font-size:26px" aria-label="Figura da categoria"><input type="text" id="cn" maxlength="20" placeholder="Nome, ex.: Nossa família"></div>
    <textarea id="cw" placeholder="Palavras separadas por vírgula. Pode pôr figura e dica: 🐶 Totó | late muito, 🏖️ Praia da vovó | tem areia"></textarea>
    <div class="err" id="cerr"></div>
    <div class="row"><button class="white" data-a="close">Cancelar</button><button class="go" data-a="savecat">Salvar</button></div>`);
}

const keepScroll = f => { const y = window.scrollY; f(); window.scrollTo(0, y); };
const act = {
  home: () => { readPlayers(); persist(); home(); }, setup: () => { readPlayers(); persist(); setup(); }, rules, start, close: closeModal, newcat: newCat,
  reset: () => modal(`<h2>Zerar o placar?</h2><p>Os pontos de todo mundo voltam a zero.</p><div class="row"><button class="white" data-a="close">Cancelar</button><button class="hot" data-a="reset-yes">Zerar</button></div>`),
  "reset-yes": () => { scores = {}; persist(); closeModal(); home(); },
  av: e => { readPlayers(); avPicker(+e.dataset.i); },
  setav: e => { cfg.players[+e.dataset.i].a = +e.dataset.k; persist(); closeModal(); setup(); },
  next1: () => { const bad = checkPlayers(); if (bad) return $("#err").textContent = bad; options(); },
  back: () => { stopCountdown(); closeModal(); G = null; options(); },
  addp: () => { readPlayers(); if (cfg.players.length < 20) { const taken = cfg.players.map(q => q.a % AV.length); let a = 0; while (taken.includes(a) && a < AV.length - 1) a++; cfg.players.push({ n: "Jogador " + (cfg.players.length + 1), a }); } setup(); const ins = document.querySelectorAll("[data-p]"); const l = ins[ins.length - 1]; l.focus(); l.select(); },
  delp: e => { readPlayers(); cfg.players.splice(+e.dataset.i, 1); setup(); },
  "imp-": () => { readPlayers(); cfg.imps = Math.max(1, cfg.imps - 1); setup(); },
  "imp+": () => { readPlayers(); cfg.imps = Math.min(4, cfg.imps + 1); setup(); },
  cat: e => { readPlayers(); const c = e.dataset.c; cfg.cats = cfg.cats.includes(c) ? cfg.cats.filter(x => x !== c) : cfg.cats.concat(c); keepScroll(options); },
  all: () => { readPlayers(); cfg.cats = Object.keys(allCats()); keepScroll(options); },
  none: () => { readPlayers(); cfg.cats = []; keepScroll(options); },
  time: e => { readPlayers(); cfg.time = +e.dataset.s; keepScroll(options); },
  savecat: () => {
    const n = $("#cn").value.trim(), icon = $("#ci").value.trim() || "⭐";
    const w = [...new Set($("#cw").value.split(/[,\n]/).map(s => s.trim()).filter(Boolean))];
    if (!n) return $("#cerr").textContent = "Dê um nome à categoria.";
    if (CATS[n]) return $("#cerr").textContent = "Esse nome já existe.";
    if (w.length < 5) return $("#cerr").textContent = "Coloque pelo menos 5 palavras.";
    readPlayers(); custom[n] = { icon, words: w }; if (!cfg.cats.includes(n)) cfg.cats.push(n); persist(); closeModal(); options();
  },
  next: () => { G.i++; G.i < G.players.length ? reveal() : discuss(); },
  pause: () => G.pause && G.pause(), vote, "back-discuss": discuss,
  pick: e => countdown(e.dataset.n),
  "guess-yes": () => afterGuess(true), "guess-no": () => afterGuess(false),
  again: () => { options(); start(); }
};

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]");
  if (b && !b.disabled && act[b.dataset.a]) { ev.preventDefault(); act[b.dataset.a](b); }
  else if (ev.target.id === "modal" && !$("#modalBox").querySelector("[data-a^=guess]")) closeModal();
});
document.addEventListener("input", ev => { if (ev.target.dataset.p !== undefined) cfg.players[+ev.target.dataset.p].n = ev.target.value; });

// Botão "voltar" do Android: o app nativo chama window.appBack(); retorna false para fechar o app.
window.appBack = () => {
  if (document.querySelector(".cd")) { act.back(); return true; }
  if (!$("#modal").classList.contains("hidden")) { if (!$("#modalBox").querySelector("[data-a^=guess]")) closeModal(); return true; }
  if (screen === "home") return false;
  if (screen === "players") { act.home(); return true; }
  if (screen === "options") { act.setup(); return true; }
  if (screen === "end") { home(); return true; }
  act.back(); return true;
};
window.__EMOJI = () => [...Object.values(CATS).flatMap(([i, w]) => [i, ...w.split(",").map(x => split(x)[0])]), ...AV, ...UI, "💬"];

home();
}
</script>
</body>
</html>
